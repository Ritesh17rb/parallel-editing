<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract AI Collab</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iMTUiIGZpbGw9IiMyNTYzZWIiLz48cGF0aCBmaWxsPSIjZmZmIiBkPSJtMTYgNyAyIDcgNyAyLTcgMi0yIDctMi03LTctMiA3LTJaIi8+PC9zdmc+">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

  <style>
    /* Scaffolding Styles */
    .chat-msg {
      white-space: pre-wrap;
      word-break: break-word
    }

    .chat-box {
      max-height: 75vh;
      min-height: 50vh;
      overflow: auto
    }

    .narrative {
      max-width: 960px
    }

    /* Custom Editor Styles */
    #editor-wrapper {
      height: 70vh;
      display: flex;
      flex-direction: column;
    }

    #editor-container {
      flex-grow: 1;
      font-family: 'Georgia', serif;
      font-size: 1.1rem;
      background-color: var(--bs-body-bg);
      border-bottom-left-radius: 5px;
      border-bottom-right-radius: 5px;
    }

    /* Collaboration Cursors */
    .ql-cursor {
      opacity: 0.8;
    }

    .ql-cursor-flag {
      font-size: 10px;
      padding: 2px 4px;
      font-weight: bold;
      border-radius: 2px;
    }

    /* AI Activity Indicator */
    .ai-active-border {
      animation: pulse-border 1.5s infinite;
      border: 2px solid #0d6efd !important;
    }

    @keyframes pulse-border {
      0% {
        border-color: transparent;
      }

      50% {
        border-color: #0d6efd;
      }

      100% {
        border-color: transparent;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href=".">Contract<span class="text-primary fw-bold">AI</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <!-- Native Bootstrap Modal used instead of web component -->

        <div class="nav-item dropdown ms-auto" role="group" aria-label="Configure LLM" title="Configure LLM">
          <button id="configure-llm" class="btn btn-outline-primary" type="button" aria-label="Configure LLM"> <i
              class="bi bi-gear"></i> Configure<span class="d-lg-none ms-2">Configure LLM</span> </button>
        </div>

        <div class="nav-item dropdown ms-2" role="group" aria-label="Toggle dark mode" title="Toggle Dark Mode">
          <button class="dark-theme-toggle btn btn-outline-light dropdown-toggle" type="button"
            data-bs-toggle="dropdown" aria-expanded="false" aria-label="Toggle theme (dark)">
            <i class="bi bi-circle-half"></i> <span class="d-lg-none ms-2">Toggle theme</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item" data-bs-theme-value="light" aria-pressed="false"><i
                  class="me-2 bi bi-sun-fill"></i> Light</button></li>
            <li><button class="dropdown-item active" data-bs-theme-value="dark" aria-pressed="true"><i
                  class="me-2 bi bi-moon-stars-fill"></i> Dark</button></li>
            <li><button class="dropdown-item" data-bs-theme-value="auto" aria-pressed="false"><i
                  class="me-2 bi bi-circle-half"></i> Auto</button></li>
          </ul>
        </div>
        <div class="ms-2 d-flex align-items-center">
          <span class="badge bg-success bg-opacity-25 text-success border border-success px-3 py-2"><i
              class="bi bi-people-fill me-1"></i> <span id="user-count">1</span> Active</span>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row g-4">

      <div class="col-lg-8">
        <div class="card shadow-sm h-100">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-bold"><i class="bi bi-file-earmark-text me-2"></i>Agreement.docx</span>
            <small class="text-muted" id="status-indicator">Ready for collaboration</small>
          </div>
          <div id="editor-wrapper" class="card-body p-0">
            <div id="editor-container"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-primary text-white">
            <i class="bi bi-robot me-2"></i>AI Co-Pilot
          </div>
          <div class="card-body">
            <p class="small text-muted">The AI acts as a user. It streams edits via CRDTs while you type.</p>

            <div class="d-grid gap-2 mb-4">
              <button class="btn btn-warning text-start ai-action" data-mode="fill-gaps"
                data-prompt="Identify all placeholders (like [DATE], [PARTY], etc) and replace them with realistic values for a Technology Services Agreement.">
                <i class="bi bi-pencil-square me-2"></i> <b>Fill Gaps</b> / Placeholders
              </button>
              <button class="btn btn-outline-primary text-start ai-action" data-mode="insert"
                data-prompt="Add a 'Force Majeure' clause covering pandemics and government acts.">
                <i class="bi bi-plus-circle me-2"></i> Insert <b>Force Majeure</b>
              </button>
              <button class="btn btn-outline-primary text-start ai-action" data-mode="rewrite"
                data-prompt="Rewrite the selected text to be Mutual (apply to both parties).">
                <i class="bi bi-arrow-repeat me-2"></i> Make <b>Mutual</b>
              </button>
              <button class="btn btn-outline-danger text-start ai-action" data-mode="insert"
                data-prompt="Add a Liability Cap limiting damages to $50,000.">
                <i class="bi bi-shield-lock me-2"></i> Add <b>Liability Cap</b>
              </button>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Custom Instruction</label>
              <div class="input-group">
                <input type="text" id="custom-prompt" class="form-control" placeholder="e.g. Change payment to 45 days">
                <button id="btn-custom" class="btn btn-primary"><i class="bi bi-send"></i></button>
              </div>
            </div>

            <hr>
            <h6 class="small text-muted mb-2">Activity Log</h6>
            <div id="logs" class="bg-body-secondary p-2 rounded small font-monospace"
              style="height: 150px; overflow-y: auto;">
              > Connected to Yjs room.<br>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container mt-4">
    <div class="accordion mb-3" id="advancedSettingsAccordion">
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
            data-bs-target="#advanced-settings">
            <i class="bi bi-sliders2 me-2"></i> Advanced Settings
          </button>
        </h2>
        <div id="advanced-settings" class="accordion-collapse collapse" data-bs-parent="#advancedSettingsAccordion">
          <div class="accordion-body">
            <form id="settings-form" class="row g-3">
              <div class="col-md-6">
                <label for="model" class="form-label">Model</label>
                <input id="model" name="model" class="form-control" placeholder="gpt-4o-mini" value="gpt-4o-mini">
              </div>
              <div class="col-12">
                <label for="system-prompt" class="form-label">System Prompt</label>
                <textarea id="system-prompt-input" class="form-control" rows="3">You are a legal assistant.</textarea>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "bootstrap-llm-provider": "https://cdn.jsdelivr.net/npm/bootstrap-llm-provider@latest/+esm",
        "asyncllm": "https://cdn.jsdelivr.net/npm/asyncllm@2/+esm",
        "saveform": "https://cdn.jsdelivr.net/npm/saveform@1.4.0/+esm",
        "yjs": "https://esm.sh/yjs@13",
        "y-webrtc": "https://esm.sh/y-webrtc@10?external=yjs",
        "y-indexeddb": "https://esm.sh/y-indexeddb?external=yjs",
        "y-quill": "https://esm.sh/y-quill?external=yjs,quill",
        "quill": "https://esm.sh/quill@1.3.6"
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@gramex/ui@0.3.1/dist/dark-theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="script.js"></script>

  <!-- Local LLM Config Modal -->
  <div class="modal fade" id="llmConfigModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Configure LLM</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="llm-api-key" class="form-label">API Key</label>
              <input type="password" class="form-control" id="llm-api-key" placeholder="sk-..." autocomplete="off">
            </div>
            <div class="mb-3">
              <label for="llm-url" class="form-label">Base URL</label>
              <input type="text" class="form-control" id="llm-url" placeholder="https://api.openai.com/v1">
              <div class="form-text small">Optional. Leave empty for default OpenAI.</div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" id="save-llm-config">Save Settings</button>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
